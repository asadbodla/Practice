name: Build Atlas Quest APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build APK
        run: |
          for i in 1 2 3 4; do
            gradle assembleRelease --no-daemon && exit 0
            echo "Build attempt $i failed (often a temporary download limit). Retrying in $((i*45))s..."; sleep $((i*45))
          done
          exit 1
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk AtlasQuest.apk
      - uses: actions/upload-artifact@v4
        with: { name: AtlasQuest-apk, path: AtlasQuest.apk }
      - name: Publish release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release create "v1.${{ github.run_number }}" AtlasQuest.apk \
            --target "${{ github.sha }}" --title "Atlas Quest v1.${{ github.run_number }}" \
            --notes "Download AtlasQuest.apk below and open it on the tablet to install."
